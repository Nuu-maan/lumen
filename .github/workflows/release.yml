name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
          - os: ubuntu-22.04
            args: "--bundles appimage,deb"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libclang-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Lumen ${{ github.ref_name }}
          releaseBody: |
            Download the installer for your system below, then follow the [install guide](https://github.com/Nuu-maan/lumen#install).

            | System | File |
            |---|---|
            | Windows 10/11 | `Lumen_*_x64-setup.exe` |
            | macOS 11+ (Apple Silicon and Intel) | `Lumen_*_universal.dmg` |
            | Linux | `Lumen_*_amd64.AppImage` or `Lumen_*_amd64.deb` |

            For the exact layout of Word, Excel and PowerPoint files, also install the free [LibreOffice](https://www.libreoffice.org/download/download-libreoffice/).
          releaseDraft: true
          args: ${{ matrix.args }}
