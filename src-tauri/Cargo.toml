[package]
name = "lumen"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
default-run = "lumen"

[lib]
name = "lumen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memchr = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
cfb = "0.16"
parking_lot = "0.12"
lru = { version = "0.16", default-features = false }
tokio = { version = "1", features = ["sync"] }
memmap2 = "0.9"
regex = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
mail-parser = "1"
quick-xml = "0.42"
calamine = { version = "0.38", default-features = false }
csv = "1"
blake3 = { version = "1", features = ["mmap"] }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
mupdf = { git = "https://github.com/messense/mupdf-rs", rev = "80e7792bc1b1b620fa03816fccf02ab4b7db7a1b", default-features = false, features = ["xps", "svg", "cbz", "img", "html", "epub", "base14-fonts"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
